# Echo API — Docker Compose (Coolify)
# Deploys a Fastify + Prisma API + PostgreSQL para perfis de usuario e guildas.
#
# O PostgreSQL fica exposto na porta 5432 do host para acesso externo via DBeaver.
#
# Variaveis de ambiente obrigatorias (definir no Coolify):
#   DATABASE_URL          (postgresql://echo_api:senha@db:5432/echo_profiles?schema=public)
#   API_KEY               (chave de autenticacao da API)
#   PUBLIC_BASE_URL       (https://api.echo.litteris.online)
#   POSTGRES_PASSWORD     (senha do postgres superuser)
#   POSTGRES_USER         (usuario do postgres, default: postgres)
#   POSTGRES_DB           (nome do banco, default: echo_profiles)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echo-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      API_KEY: ${API_KEY:?API_KEY is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      PORT: 3001
      NODE_ENV: production
      UPLOAD_DIR: ./src/uploads
      MAX_FILE_SIZE: 10485760
    networks:
      - coolify
    volumes:
      - echo_api_uploads:/app/src/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.echo-api.rule=Host(`api.echo.litteris.online`)"
      - "traefik.http.routers.echo-api.entryPoints=http"
      - "traefik.http.services.echo-api.loadbalancer.server.port=3001"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: echo-api-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-echo_profiles}
    networks:
      - coolify
    ports:
      - "5432:5432"  # Exposto para acesso externo via DBeaver
    volumes:
      - echo_api_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-echo_profiles}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  echo_api_uploads:
  echo_api_db_data:

networks:
  coolify:
    external: true
