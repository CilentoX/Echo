name: Update latest.json on echo-site

on:
  release:
    types: [published]

jobs:
  update-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout echo-site
        uses: actions/checkout@v4
        with:
          repository: CilentoX/Echo-site
          token: ${{ secrets.ECOSITE_PAT }}
          path: echo-site

      - name: Get release info
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getLatestRelease({
              owner: 'CilentoX',
              repo: 'Echo'
            });
            const exe = release.data.assets.find(a => a.name.endsWith('_x64-setup.exe'));
            const sig = release.data.assets.find(a => a.name.endsWith('.exe.sig'));
            if (!exe || !sig) {
              core.setFailed('Could not find required release assets (.exe or .sig)');
              return;
            }
            core.setOutput('exe_url', exe.browser_download_url);
            core.setOutput('sig_url', sig.browser_download_url);
            core.setOutput('version', release.data.tag_name.replace('v', ''));
            core.setOutput('notes', (release.data.body || '').replace(/\n/g, '\\n').replace(/"/g, '\\"'));

      - name: Download signature
        run: |
          curl -sL "${{ steps.release.outputs.sig_url }}" -o echo-site/Echo_${{ steps.release.outputs.version }}_x64-setup.exe.sig
          base64 -w0 echo-site/Echo_${{ steps.release.outputs.version }}_x64-setup.exe.sig > echo-site/sig.b64

      - name: Write latest.json
        run: |
          cat > echo-site/latest.json <<EOF
          {
            "version": "${{ steps.release.outputs.version }}",
            "notes": "${{ steps.release.outputs.notes }}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$(cat echo-site/sig.b64)",
                "url": "${{ steps.release.outputs.exe_url }}"
              }
            }
          }
          EOF
          rm echo-site/sig.b64

      - name: Commit and push
        working-directory: echo-site
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add latest.json
          git commit -m "chore: update latest.json for v${{ steps.release.outputs.version }}" || true
          git push
