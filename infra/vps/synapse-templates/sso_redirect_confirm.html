{% extends "_base.html" %}
{% block title %}Continuar — Echo{% endblock %}
{% block body %}
<div class="eco-sso-page">
  <div class="eco-sso-header">
    <div class="eco-logo">
      <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
        <rect x="4" y="5" width="7" height="22" rx="3.5" fill="currentColor" />
        <rect x="13" y="5" width="15" height="7" rx="3.5" fill="currentColor" />
        <rect x="13" y="20" width="15" height="7" rx="3.5" fill="currentColor" />
      </svg>
    </div>
    <h1>Continuar para {{ display_name }}</h1>
  </div>

  <p class="eco-sso-subtitle">{{ user_id }}</p>

  <p class="eco-sso-subtitle">Ao continuar, o aplicativo abaixo receberá acesso à sua conta.</p>
  <p class="eco-sso-subtitle" style="word-break: break-all;"><strong>{{ redirect_url }}</strong></p>

  <form method="POST">
    <button type="submit" class="eco-primary-button">Continuar</button>
  </form>
</div>
{% endblock %}
