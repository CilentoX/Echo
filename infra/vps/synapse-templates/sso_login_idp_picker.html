{% extends "_base.html" %}
{% block title %}Entrar — Echo{% endblock %}
{% block body %}
<div class="eco-sso-page">
  <div class="eco-sso-header">
    <div class="eco-logo">
      <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
        <rect x="4" y="5" width="7" height="22" rx="3.5" fill="currentColor" />
        <rect x="13" y="5" width="15" height="7" rx="3.5" fill="currentColor" />
        <rect x="13" y="20" width="15" height="7" rx="3.5" fill="currentColor" />
      </svg>
    </div>
    <h1>Entrar no Echo</h1>
  </div>

  <p class="eco-sso-subtitle">Escolha como deseja entrar:</p>

  <form method="GET">
    <input type="hidden" name="redirectUrl" value="{{ redirect_url }}">

    {% for provider in providers %}
    <button type="submit" name="idp" value="{{ provider.idp_id }}" class="eco-idp-button">
      {% if provider.idp_icon %}
      <img src="{{ provider.idp_icon }}" alt="{{ provider.idp_name }}" class="eco-idp-icon">
      {% endif %}
      {{ provider.idp_name }}
    </button>
    {% endfor %}
  </form>
</div>
{% endblock %}
