<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Echo{% endblock %}</title>
  <style>
    :root {
      --eco-bg: #0D1017;
      --eco-rail: #12151C;
      --eco-surf: #171B24;
      --eco-surf2: #1D222D;
      --eco-bd: #2A3546;
      --eco-txt: #E9EDF2;
      --eco-mut: #97A2B0;
      --eco-acc: #14B8A6;
      --eco-acc-press: #0D9488;
      --eco-err: #F87171;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--eco-bg);
      color: var(--eco-txt);
      font-family: "Space Grotesk", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .eco-sso-page {
      width: 100%;
      max-width: 420px;
      padding: 40px 24px;
      text-align: center;
    }

    .eco-sso-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .eco-logo {
      display: inline-block;
    }

    .eco-sso-header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--eco-txt);
    }

    .eco-sso-subtitle {
      font-size: 14px;
      color: var(--eco-mut);
      margin-bottom: 24px;
    }

    .eco-form-field {
      text-align: left;
      margin-bottom: 16px;
    }

    .eco-form-field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--eco-mut);
      margin-bottom: 8px;
    }

    .eco-form-field input {
      width: 100%;
      background: var(--eco-surf);
      border: 1px solid var(--eco-bd);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--eco-txt);
      font-size: 16px;
      font-family: inherit;
    }

    .eco-form-field input:focus {
      outline: none;
      border-color: var(--eco-acc);
    }

    .eco-suffix {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--eco-mut);
      font-size: 14px;
    }

    .eco-form-field {
      position: relative;
    }

    .eco-primary-button {
      width: 100%;
      background: var(--eco-acc);
      border: none;
      border-radius: 8px;
      padding: 12px;
      color: var(--eco-bg);
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
    }

    .eco-primary-button:hover {
      background: var(--eco-acc-press);
    }

    .eco-primary-button:active {
      transform: scale(0.98);
    }

    .eco-idp-button {
      width: 100%;
      background: var(--eco-surf);
      border: 1px solid var(--eco-bd);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--eco-txt);
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .eco-idp-button:hover {
      background: var(--eco-surf2);
      border-color: var(--eco-acc);
    }

    .eco-idp-icon {
      width: 20px;
      height: 20px;
    }

    .eco-error {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid var(--eco-err);
      border-radius: 8px;
      padding: 12px 16px;
      color: #FCA5A5;
      font-size: 14px;
      margin-bottom: 16px;
      text-align: left;
    }

    @media (max-width: 480px) {
      .eco-sso-page { padding: 24px 16px; }
    }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
