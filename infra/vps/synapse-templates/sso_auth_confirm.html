{% extends "_base.html" %}
{% block title %}Confirmar login — Echo{% endblock %}
{% block body %}
<div class="eco-sso-page">
  <div class="eco-sso-header">
    <div class="eco-logo">
      <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
        <rect x="4" y="5" width="7" height="22" rx="3.5" fill="currentColor" />
        <rect x="13" y="5" width="15" height="7" rx="3.5" fill="currentColor" />
        <rect x="13" y="20" width="15" height="7" rx="3.5" fill="currentColor" />
      </svg>
    </div>
    <h1>Confirmar login</h1>
  </div>

  <p class="eco-sso-subtitle">Você está entrando com a sua conta Google.</p>

  <form method="POST">
    <button type="submit" class="eco-primary-button">Confirmar</button>
  </form>
</div>
{% endblock %}
