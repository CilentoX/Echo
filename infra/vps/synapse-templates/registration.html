{% extends "_base.html" %}
{% block title %}Criar conta — Echo{% endblock %}
{% block body %}
<div class="eco-sso-page">
  <div class="eco-sso-header">
    <div class="eco-logo">
      <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
        <rect x="4" y="5" width="7" height="22" rx="3.5" fill="currentColor" />
        <rect x="13" y="5" width="15" height="7" rx="3.5" fill="currentColor" />
        <rect x="13" y="20" width="15" height="7" rx="3.5" fill="currentColor" />
      </svg>
    </div>
    <h1>Entrar com convite</h1>
  </div>

  <p class="eco-sso-subtitle">Informe o token de convite da sua comunidade.</p>

  {% if error is defined %}
  <div class="eco-error">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="eco-form-field">
      <label for="token">Token de convite</label>
      <input type="text" id="token" name="token" required autocomplete="off">
    </div>

    <button type="submit" class="eco-primary-button">Validar convite</button>
  </form>
</div>
{% endblock %}
