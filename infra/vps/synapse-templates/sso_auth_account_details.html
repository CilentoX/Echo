{% extends "_base.html" %}
{% block title %}Escolher usuário — Echo{% endblock %}
{% block body %}
<div class="eco-sso-page">
  <div class="eco-sso-header">
    <div class="eco-logo">
      <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
        <rect x="4" y="5" width="7" height="22" rx="3.5" fill="currentColor" />
        <rect x="13" y="5" width="15" height="7" rx="3.5" fill="currentColor" />
        <rect x="13" y="20" width="15" height="7" rx="3.5" fill="currentColor" />
      </svg>
    </div>
    <h1>Escolha seu usuário</h1>
  </div>

  <p class="eco-sso-subtitle">Este será seu nome de usuário permanente no Echo.</p>

  <form method="POST">
    <input type="hidden" name="username" value="{{ user_attributes.localpart }}">

    <div class="eco-form-field">
      <label for="username">Usuário</label>
      <input type="text" id="username" name="username" value="{{ user_attributes.localpart }}" required autocomplete="username">
      <span class="eco-suffix">@{{ server_name }}</span>
    </div>

    <button type="submit" class="eco-primary-button">Confirmar e entrar</button>
  </form>
</div>
{% endblock %}
