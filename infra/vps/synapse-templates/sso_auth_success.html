{% extends "_base.html" %}
{% block title %}Bem-vindo ao Echo{% endblock %}
{% block body %}
<div class="eco-sso-page">
  <div class="eco-sso-header">
    <div class="eco-logo">
      <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
        <rect x="4" y="5" width="7" height="22" rx="3.5" fill="currentColor" />
        <rect x="13" y="5" width="15" height="7" rx="3.5" fill="currentColor" />
        <rect x="13" y="20" width="15" height="7" rx="3.5" fill="currentColor" />
      </svg>
    </div>
    <h1>Login realizado</h1>
  </div>

  <p class="eco-sso-subtitle">Você está conectado. Redirecionando para o app…</p>

  <script>
    // Redirect back to the client after a short delay
    setTimeout(function() {
      window.close();
    }, 1500);
  </script>
</div>
{% endblock %}
