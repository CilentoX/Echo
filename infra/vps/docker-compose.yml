# Eco homeserver — production deploy kit (VPS).
# Runs Synapse + Postgres behind coolify-proxy (Traefik) on the host network
# `coolify`. No host ports are published: Traefik reaches Synapse via the
# `coolify` network using the labels below (router/service names `eco`).
# Secrets come from `.env` in this directory (see .env.example).

name: eco

services:
  synapse:
    image: matrixdotorg/synapse:v1.163.0
    container_name: eco-synapse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eco_net
      - coolify
    volumes:
      - synapse_data:/data
      # Rendered config (from homeserver.yaml.template via envsubst), mounted
      # as a single file over the volume. Read-only on purpose: edit the
      # template, re-render, then `docker compose restart synapse`.
      - ./synapse/homeserver.yaml:/data/homeserver.yaml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.eco.rule=Host(`eco.litteris.online`) && PathPrefix(`/`)"
      - "traefik.http.routers.eco.entryPoints=http"
      - "traefik.http.services.eco.loadbalancer.server.port=8008"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: eco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    networks:
      - eco_net
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  synapse_data:
  pgdata:

networks:
  eco_net:
    driver: bridge
  coolify:
    external: true
