<!doctype html>
<html lang="pt-BR" style="background-color: #0D1017; margin: 0; padding: 0;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <title>Echo</title>
    <style>
      html, body {
        background-color: #0D1017 !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
        user-select: none;
      }
      #root {
        background-color: #0D1017 !important;
        min-height: 100vh;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes ping {
        75%, 100% {
          transform: scale(2);
          opacity: 0;
        }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 0.3; }
      }
    </style>
  </head>

  <body style="background-color: #0D1017; margin: 0; padding: 0;">
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0D1017;user-select:none;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <div style="width:312px;height:380px;background:#0D1017;display:flex;flex-direction:column;justify-content:space-between;align-items:center;position:relative;overflow:hidden;border-radius:16px;border:1px solid #232D3D;box-shadow:0 16px 50px rgba(0,0,0,0.9),0 0 35px rgba(15,185,168,0.2);">
          <!-- Top ambient glow -->
          <div style="position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:200px;height:160px;background:radial-gradient(circle,rgba(15,185,168,0.25) 0%,transparent 70%);border-radius:50%;pointer-events:none;"></div>
          <!-- Window control dots -->
          <div style="width:100%;height:32px;padding:12px 14px 0;display:flex;align-items:center;gap:8px;z-index:10;box-sizing:border-box;">
            <div style="width:12px;height:12px;border-radius:50%;background:#EF4444;"></div>
            <div style="width:12px;height:12px;border-radius:50%;background:#F59E0B;"></div>
            <div style="width:12px;height:12px;border-radius:50%;background:#0FB9A8;box-shadow:0 0 8px rgba(15,185,168,0.6);"></div>
          </div>
          <!-- Center logo & vortex -->
          <div style="position:relative;display:flex;align-items:center;justify-content:center;margin:auto;">
            <div style="position:absolute;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(20,218,166,0.25) 0%,transparent 70%);pointer-events:none;"></div>
            <!-- Outer SVG -->
            <svg style="position:absolute;width:156px;height:156px;animation:spin-reverse 6s linear infinite;pointer-events:none;" viewBox="0 0 100 100" fill="none">
              <path d="M 25 15 A 42 42 0 0 1 75 15" stroke="#0FB9A8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
              <path d="M 75 85 A 42 42 0 0 1 25 85" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
            </svg>
            <!-- Inner Vortex SVG -->
            <svg style="position:absolute;width:138px;height:138px;animation:spin 1.8s linear infinite;filter:drop-shadow(0 0 14px rgba(20,218,166,0.65));pointer-events:none;" viewBox="0 0 100 100" fill="none">
              <path d="M 50 10 A 40 40 0 0 1 88 32" stroke="#0FB9A8" stroke-width="6" stroke-linecap="round"/>
              <path d="M 82 74 A 40 40 0 0 1 40 90" stroke="#14DAA6" stroke-width="5.5" stroke-linecap="round" opacity="0.95"/>
              <path d="M 18 68 A 40 40 0 0 1 14 36" stroke="#2DD4BF" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
            </svg>
            <!-- Pedestal & Logo -->
            <div style="position:relative;width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#131722;border:1px solid rgba(15,185,168,0.4);box-shadow:0 0 24px rgba(15,185,168,0.35),inset 0 2px 8px rgba(0,0,0,0.8);z-index:10;">
              <img src="/echo-logo.png" width="54" height="54" alt="Echo" style="filter:drop-shadow(0 0 16px rgba(20,218,166,0.85));user-select:none;pointer-events:none;object-fit:contain;"/>
            </div>
          </div>
          <!-- Bottom Text -->
          <div style="width:100%;padding-bottom:28px;padding-left:16px;padding-right:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:10;box-sizing:border-box;">
            <p style="color:#F1F5F9;font-weight:700;font-size:15px;letter-spacing:0.02em;margin:0;">SINTONIZANDO FREQUÊNCIAS...</p>
            <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;">
              <span style="position:relative;display:flex;width:8px;height:8px;">
                <span style="position:absolute;width:100%;height:100%;border-radius:50%;background:#14DAA6;opacity:0.75;animation:ping 1s cubic-bezier(0,0,0.2,1) infinite;"></span>
                <span style="position:relative;display:inline-block;width:8px;height:8px;border-radius:50%;background:#0FB9A8;box-shadow:0 0 8px #0FB9A8;"></span>
              </span>
              <p style="font-size:11px;font-weight:700;letter-spacing:0.1em;color:#14DAA6;text-transform:uppercase;margin:0;filter:drop-shadow(0 0 8px rgba(20,218,166,0.5));">VERIFICANDO ATUALIZAÇÕES...</p>
            </div>
          </div>
          <!-- Bottom Scanning Line -->
          <div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent, #14DAA6, transparent);animation:pulse 2s infinite;pointer-events:none;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
